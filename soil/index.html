<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil Korea</title>
<meta name="description" content="Soil Korea 공식 채널 모음: 카카오톡 오픈채팅, 네이버 블로그, X">
<meta property="og:title" content="Soil Korea">
<meta property="og:description" content="Soil Korea 공식 채널 모음">
<meta property="og:image" content="https://chanhongjeong.github.io/web3_content_studio/soil/logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#13243A;--green:#1F4D3A;--muted:#6B7280;--line:#E6DDCB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 16px 40px}
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:88px;height:88px;display:block;margin:0 auto 18px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .sub{margin-top:8px;font-size:15px;color:var(--muted);line-height:1.5}
  .links{margin-top:32px;display:flex;flex-direction:column;gap:12px}
  a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);text-align:left;transition:transform .15s,border-color .15s}
  a.link:hover{transform:translateY(-2px);border-color:var(--green)}
  .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
  .ico svg{width:24px;height:24px}
  .t{flex:1;min-width:0}
  .t b{display:block;font-size:16px;font-weight:700}
  .t span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .arr{color:var(--muted);font-size:18px}
  .kakao{background:#FEE500}
  .naver{background:#03C75A}
  .x{background:#000}
  .global{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
  .global p{font-size:13px;color:var(--muted);margin-bottom:12px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chips a{font-size:13px;color:var(--green);text-decoration:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
  footer{margin-top:32px;font-size:12px;color:#9CA3AF}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Soil 로고">
  <h1>Soil Korea</h1>
  <p class="sub">XRPL 위에서 XRP를 예치하는 프로토콜<br>한국 커뮤니티 공식 채널이에요</p>

  <div class="links">
    <a class="link" href="https://open.kakao.com/o/p7YkBgDi" target="_blank" rel="noopener">
      <span class="ico kakao"><svg viewBox="0 0 24 24"><path fill="#191919" d="M12 3C6.48 3 2 6.58 2 11c0 2.83 1.84 5.32 4.62 6.74l-.96 3.5c-.08.3.26.54.52.37l4.17-2.77c.54.07 1.09.11 1.65.11 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg></span>
      <span class="t"><b>카카오톡 오픈채팅</b><span>궁금한 건 여기서 바로 물어보세요</span></span>
      <span class="arr">›</span>
    </a>
    <a class="link" href="https://blog.naver.com/soil_korea" target="_blank" rel="noopener">
      <span class="ico naver"><svg viewBox="0 0 24 24"><path fill="#fff" d="M15.6 12.8 8.1 2H2v20h6.4V11.2L15.9 22H22V2h-6.4z"/></svg></span>
      <span class="t"><b>네이버 블로그</b><span>예치 가이드와 FAQ를 차근차근</span></span>
      <span class="arr">›</span>
    </a>
    <a class="link" href="https://x.com/soil_korea" target="_blank" rel="noopener">
      <span class="ico x"><svg viewBox="0 0 24 24"><path fill="#fff" d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.18h1.7L7.4 4.73H5.58l11.09 14.45z"/></svg></span>
      <span class="t"><b>X @soil_korea</b><span>새 소식과 이벤트를 가장 빨리</span></span>
      <span class="arr">›</span>
    </a>
  </div>

  <div class="global">
    <p>글로벌 채널</p>
    <div class="chips">
      <a href="https://soil.co" target="_blank" rel="noopener">soil.co</a>
      <a href="https://x.com/soil_farm" target="_blank" rel="noopener">X @soil_farm</a>
      <a href="https://t.me/soilfarm" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>

  <footer>© Soil Korea</footer>
</main>
</body>
</html>
